<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GitLab Pipeline Prefill</title>
    <link rel="stylesheet" href="./popup.css"/>
</head>
<body>

<div id="app" class="is-empty">
    <div id="profile-switcher-wrap">
        <label for="profile-select">Profile</label>
        <div class="field-row">
            <button id="btn-new-profile" type="button" aria-label="New profile" title="New profile">+</button>
            <button id="btn-delete" type="button" aria-label="Delete" title="Delete" disabled>×</button>
            <select id="profile-select"></select>
        </div>
    </div>

    <div id="name-wrap">
        <label for="profile-name">Name</label>
        <div class="field-row">
            <button id="btn-apply" type="button" aria-label="Apply" title="Apply" disabled>▶</button>
            <input id="profile-name" type="text"/>
        </div>
    </div>
    <div id="bulk-view">
        <textarea id="bulk-text" spellcheck="false"></textarea>
    </div>

    <div id="error-line"></div>
</div>

<script type="module" src="./main.ts"></script>

</body>
</html>
